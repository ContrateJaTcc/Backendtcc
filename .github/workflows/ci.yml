# A cada push e pull request: confere a sintaxe de todos os arquivos e roda os testes (sem banco)
name: CI

on:
  push:
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sintaxe
        run: for f in $(find src -name '*.js') server.js; do node --check "$f"; done
      - run: npm test
        env:
          JWT_SECRET: segredo-dos-testes
